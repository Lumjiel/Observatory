name: Sync to Gitee

on:
  push:
    branches: [main, server]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        run: |
          git remote add gitee https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/jjmk6/Observatory.git
          git push gitee --all --force
          git push gitee --tags --force
